<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>菜单</title>
    <script type="module" crossorigin src="./assets/menu-CC1VOfyS.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/event-KY6C6Dox.js">
    <link rel="stylesheet" crossorigin href="./assets/menu-mmrpdo87.css">
  </head>
  <body>
    <h1>桌宠菜单</h1>
    <button type="button" data-action="touch">摸一下</button>
    <button type="button" data-action="dance">跳舞</button>
    <button type="button" data-action="happy">开心</button>
    <button type="button" id="build">模型：粗壮</button>
    <label class="row">
      <span>Q版模型</span>
      <span class="switch">
        <input id="chibi" type="checkbox" />
        <span></span>
      </span>
    </label>
    <label class="row file" for="skin">
      <span>替换皮肤</span>
      <span id="skin-name">PNG</span>
      <input id="skin" type="file" accept=".png,image/png" />
    </label>
    <label class="row">
      <span>隐藏</span>
      <span class="switch">
        <input id="hide" type="checkbox" />
        <span></span>
      </span>
    </label>
  </body>
</html>
